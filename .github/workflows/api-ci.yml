name: RaheB Human API CI
on:
  push:
    branches: ["product/**", "production/**"]
  pull_request:
    branches: ["product/**", "production/**", "main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raheb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raheb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAHEB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raheb_test
      RAHEB_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raheb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -r requirements-postgres.txt
      - run: python scripts/apply_postgres_migration.py
      - run: python -m unittest discover -s tests -v
