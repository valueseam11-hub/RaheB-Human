name: Foundation CI

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:
    branches: ["main", "foundation/**"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
